<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nova Escala</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/novaEscala.css}">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">



</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h2 class="mb-4">
                Nova Escala
            </h2>

            <form
                    th:action="@{/escalas/nova}"
                    th:object="${escala}"
                    method="post">

                <input type="hidden" th:field="*{lojaId}">
                <input type="hidden" th:field="*{data}">
                <div class="mb-3">

                    <label class="form-label">
                        Motoboy
                    </label>

                    <select
                            th:field="*{motoboyId}"
                            class="form-select">

                        <option value="">
                            Selecione
                        </option>

                        <option
                                th:each="motoboy : ${motoboys}"
                                th:value="${motoboy.id}"
                                th:text="${motoboy.nome}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Horário Início
                    </label>

                    <input
                            type="time"
                            th:field="*{horarioInicio}"
                            class="form-control">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Horário Fim
                    </label>

                    <input
                            type="time"
                            th:field="*{horarioFim}"
                            class="form-control">

                </div>

                <button
                        type="submit"
                        class="btn btn-primary">

                    Salvar Escala

                </button>

                <a
                        href="/"
                        class="btn btn-secondary">

                    Voltar

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
