<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lojas</title>
    <style>
        body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f4f3fb; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        h1 { margin:0; color:#1e1b2e; }
        .btn { background:#6d3fd6; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
        .btn-danger { background:#e5484d; }
        .btn-secondary { background:#e9e6f7; color:#4c3fa0; }
        .card { background:#fff; border-radius:12px; padding:20px 24px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center; }
        .loja-nome { font-weight:700; color:#5b3fd6; margin:0 0 4px; }
        .loja-info { color:#666; font-size:14px; margin:0; }
        .actions { display:flex; gap:8px; }
        .actions form { margin:0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Lojas</h1>
        <a class="btn" th:href="@{/lojas/novo}">+ Nova Loja</a>
    </div>

    <div th:if="${#lists.isEmpty(lojas)}">
        <p>Nenhuma loja cadastrada.</p>
    </div>

    <div class="card" th:each="loja : ${lojas}">
        <div>
            <p class="loja-nome" th:text="${loja.nome}">Nome da loja</p>
            <p class="loja-info" th:text="${loja.endereco}">Endereço</p>
            <p class="loja-info">Diária: R$ <span th:text="${loja.valorDiaria}">0.00</span></p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/lojas/{id}/editar(id=${loja.id})}">Editar</a>
            <form th:action="@{/lojas/{id}/excluir(id=${loja.id})}" method="post"
                  onsubmit="return confirm('Excluir esta loja?');">
                <button class="btn btn-danger" type="submit">Excluir</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
