<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar Loja' : 'Nova Loja'">Loja</title>
    <style>
        body { margin:0; font-family:'Segoe UI', sans-serif; background:#f4f3fb; }
        .container { max-width:500px; margin:0 auto; padding:32px; }
        .card { background:#fff; border-radius:12px; padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        h1 { color:#1e1b2e; font-size:22px; margin-top:0; }
        label { display:block; font-weight:600; margin:14px 0 6px; color:#333; }
        input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
        .btn { background:#6d3fd6; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:20px; }
        .btn-secondary { background:#e9e6f7; color:#4c3fa0; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600; margin-left:8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 th:text="${modoEdicao} ? 'Editar Loja' : 'Nova Loja'">Loja</h1>
        <form th:action="${modoEdicao} ? @{/lojas/{id}(id=${lojaId})} : @{/lojas}"
              th:object="${loja}" method="post">

            <label>Nome</label>
            <input type="text" th:field="*{nome}" required>

            <label>Endereço</label>
            <input type="text" th:field="*{endereco}">

            <label>Valor da diária</label>
            <input type="number" step="0.01" th:field="*{valorDiaria}" required>

            <button class="btn" type="submit">Salvar</button>
            <a class="btn-secondary" th:href="@{/lojas}">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
