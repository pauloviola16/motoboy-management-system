<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<div th:if="${param.error}">
    Email ou senha inválidos.
</div>

<div th:if="${param.logout}">
    Logout realizado com sucesso.
</div>

<form th:action="@{/login}" method="post">

    <input
            type="email"
            name="username"
            placeholder="Email">

    <input
            type="password"
            name="password"
            placeholder="Senha">

    <button type="submit">
        Entrar
    </button>

</form>

</body>
</html>
