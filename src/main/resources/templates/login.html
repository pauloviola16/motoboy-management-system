<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Conecta Express - Login</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img th:src="@{/css/images/logoConecta.png}"
             alt="Conecta Express"
             class="logo">

        <h1>CONECTA EXPRESS</h1>

        <p class="subtitle">
            Gestão de Escalas de Motoboys
        </p>

        <div th:if="${param.error}" class="alert-error">
            Email ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert-success">
            Logout realizado com sucesso.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v16H4z" stroke="none"/>
                    <path d="M22 6l-10 7L2 6"/>
                    <path d="M2 6h20v12H2z"/>
                </svg>
                <input
                        type="email"
                        name="username"
                        placeholder="E-mail"
                        required>
            </div>

            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input
                        type="password"
                        name="password"
                        placeholder="Senha"
                        required>
            </div>

            <span class="forgot-password">Esqueci minha senha</span>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</div>

</body>
</html>
