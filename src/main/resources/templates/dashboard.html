<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Dashboard Escalas</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicons/favicon-16x16.png}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">CE</div>
            <div>
                <div class="brand-title">Conecta Escalas</div>
                <div class="brand-subtitle">CONECTA EXPRESS</div>
            </div>
        </div>

        <nav class="sidebar-nav">

            <div class="nav-section-label">Operação</div>

            <a href="/" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                Escalas
            </a>

            <div class="nav-section-label">Cadastros</div>

            <a href="/lojas" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/></svg>
                Lojas
            </a>

            <a href="/entregadores" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 18h6M13 18l2-8h-3l-2-4H8"/></svg>
                Entregadores
            </a>

            <a href="/usuarios" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M22 20c0-2.5-2-4.5-4.5-5"/></svg>
                Usuários
            </a>

        </nav>

        <form th:action="@{/logout}" method="post" class="sidebar-footer">
            <button type="submit" class="nav-link nav-link-logout">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Sair
            </button>
        </form>

    </aside>

    <main class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="fw-bold mb-0">Dashboard de Escalas</h1>
                <p class="text-muted mb-0">Visão geral da operação</p>
            </div>

            <a
                    href="/escalas/nova"
                    class="btn btn-primary">

                + Nova Escala

            </a>

        </div>

        <form
                method="get"
                action="/"
                class="row g-2 mb-4">

            <div class="col-auto">

                <input
                        type="date"
                        name="data"
                        class="form-control"
                        th:value="${dataSelecionada}">

            </div>

            <div class="col-auto">

                <button
                        type="submit"
                        class="btn btn-primary">

                    Filtrar

                </button>

            </div>

        </form>

        <div
                th:each="loja : ${lojas}"
                class="card shadow-sm mb-4 border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div>

                        <h3
                                class="card-title mb-0"
                                th:text="${loja.nomeLoja}">
                        </h3>

                    </div>

                    <div class="d-flex gap-2">

                        <a
                                th:href="@{'/escalas/nova?lojaId=' + ${loja.lojaId} + '&data=' + ${dataSelecionada}}"
                                class="btn btn-primary btn-sm">

                            + Escala

                        </a>

                    </div>

                </div>

                <div th:if="${#lists.isEmpty(loja.escalas)}">

                    <p class="text-muted mb-0">
                        Nenhuma escala cadastrada.
                    </p>

                </div>

                <div
                        th:each="escala : ${loja.escalas}"
                        class="border rounded p-3 mb-2 bg-light">

                    <div class="d-flex justify-content-between align-items-center">

                        <!-- lado esquerdo: nome + horário -->
                        <div>

                            <h5
                                    class="mb-1"
                                    th:text="${escala.nomeMotoboy}">
                            </h5>

                            <p class="mb-0 text-muted mt-1">

                                <span th:text="${escala.horarioInicio}"></span>

                                até

                                <span th:text="${escala.horarioFim}"></span>

                            </p>

                        </div>

                        <!-- lado direito: status (dropdown) + lixeira -->
                        <div class="d-flex align-items-center gap-2">

                            <div class="dropdown">

                                <button
                                        class="btn btn-sm dropdown-toggle"
                                        th:classappend="${escala.status.name() == 'CONFIRMADA'} ? ' btn-primary'
                                            : (${escala.status.name() == 'PRESENTE'} ? ' btn-success'
                                            : (${escala.status.name() == 'AUSENTE'} ? ' btn-warning'
                                            : ' btn-secondary'))"
                                        type="button"
                                        data-bs-toggle="dropdown">

                                    <span th:text="${escala.status}"></span>

                                </button>

                                <ul class="dropdown-menu">

                                    <li th:each="opcao : ${T(com.empresa.motoboy.model.StatusEscala).values()}">

                                        <form
                                                th:action="@{'/escalas/' + ${escala.escalaId} + '/status'}"
                                                method="post">

                                            <input type="hidden" name="status" th:value="${opcao}"/>

                                            <button
                                                    type="submit"
                                                    class="dropdown-item"
                                                    th:text="${opcao}">
                                            </button>

                                        </form>

                                    </li>

                                </ul>

                            </div>

                            <form
                                    th:action="@{'/escalas/' + ${escala.escalaId} + '/excluir'}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-outline-secondary btn-sm"
                                        onclick="return confirm('Deseja realmente excluir esta escala?')">

                                    🗑️

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
