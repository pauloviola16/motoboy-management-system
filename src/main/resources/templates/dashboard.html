<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Dashboard Escalas</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="fw-bold">
            Dashboard de Escalas
        </h1>

        <button class="btn btn-primary">
            + Nova Escala
        </button>

    </div>

    <div
            th:each="loja : ${lojas}"
            class="card shadow-sm mb-4 border-0">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h3
                        class="card-title mb-0"
                        th:text="${loja.nomeLoja}">
                </h3>

                <span class="badge bg-secondary">

                    <span th:text="${#lists.size(loja.escalas)}"></span>

                    escalas

                </span>

            </div>

            <div
                    th:if="${#lists.isEmpty(loja.escalas)}">

                <p class="text-muted mb-0">
                    Nenhuma escala cadastrada.
                </p>

            </div>

            <div
                    th:each="escala : ${loja.escalas}"
                    class="border rounded p-3 mb-2 bg-light">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h5
                                class="mb-1"
                                th:text="${escala.nomeMotoboy}">
                        </h5>

                        <p class="mb-0 text-muted">

                            <span th:text="${escala.horarioInicio}"></span>

                            até

                            <span th:text="${escala.horarioFim}"></span>

                        </p>

                    </div>

                    <button class="btn btn-danger btn-sm">

                        Cancelar

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
